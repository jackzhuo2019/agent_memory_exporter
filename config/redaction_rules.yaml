# PII Redaction Rules for Agent Memory Exporter
#
# Applied by the CLI before writing raw/*.json files.
# Each rule is a named regex pattern with a replacement string.
# Hit counts are recorded in redaction_report.json (no original text retained).
#
# To add a rule, add a new entry under "patterns" with:
#   name:    unique identifier
#   regex:   Python regex pattern (use raw strings to avoid escape issues)
#   replace: replacement text (defaults to [REDACTED_<NAME>])

patterns:
  - name: api_key_openai
    regex: 'sk-[A-Za-z0-9]{20,}'
    replace: '[REDACTED_API_KEY]'

  - name: api_key_generic_bearer
    regex: '(?:Bearer|bearer)\s+[A-Za-z0-9_\-\.]{20,}'
    replace: '[REDACTED_BEARER_TOKEN]'

  - name: email
    regex: '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
    replace: '[REDACTED_EMAIL]'

  - name: phone_cn
    regex: '(?<!\d)1[3-9]\d{9}(?!\d)'
    replace: '[REDACTED_PHONE]'

  - name: id_card_cn
    regex: '(?<!\d)\d{17}[\dXx](?!\d)'
    replace: '[REDACTED_ID_CARD]'

  - name: aws_access_key
    regex: 'AKIA[0-9A-Z]{16}'
    replace: '[REDACTED_AWS_KEY]'

  - name: aws_secret_key
    regex: '(?<![A-Za-z0-9/+=])[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])'
    replace: '[REDACTED_AWS_SECRET]'
    # Note: this is a rough heuristic and may over-match. Adjust as needed.

  - name: github_token
    regex: '(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}'
    replace: '[REDACTED_GITHUB_TOKEN]'

  - name: slack_token
    regex: 'xox[baprs]-[A-Za-z0-9\-]{10,}'
    replace: '[REDACTED_SLACK_TOKEN]'
