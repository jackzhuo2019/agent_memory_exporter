[project]
name = "agent-memory-exporter-cli"
version = "0.1.0"
description = "CLI tool to export agent conversations from local sources to raw JSON"
requires-python = ">=3.11"
dependencies = [
    "agent-memory-shared",
    "click>=8.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-memory-exporter = "agent_memory_exporter.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_exporter"]
