[project]
name = "agent-memory-mcp-server"
version = "0.1.0"
description = "MCP server: LLM cleaning + WeKnora ingest for agent memory"
requires-python = ">=3.11"
dependencies = [
    "agent-memory-shared",
    "agent-memory-exporter-cli",
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_mcp"]
